<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鸠 · 卡牌工坊</title>
<style>
:root{--bg:#f5f4ef;--paper:#fff;--ink:#182724;--muted:#728079;--line:#e1e6df;--green:#235b48;--gold:#bd8d38;--tint:#edf4ef;--bad:#b23838}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b6cdbf;outline-offset:2px}button{border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:9px 15px}button:hover:not(:disabled){border-color:#96ae9f;background:#f5f9f6}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover:not(:disabled){background:#164532;color:white}.quiet{background:transparent}.small{padding:5px 9px;font-size:12px}.top{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--line);background:#fcfcf9;gap:20px}.brand{display:flex;align-items:center;gap:13px}.mark{width:42px;height:42px;border:1px solid #a9bfb0;border-radius:50%;display:grid;place-items:center;background:#edf3ea;font-size:23px;color:var(--green)}h1{font-size:20px;margin:0;letter-spacing:2px}.sub{font-size:12px;color:var(--muted)}.actions{display:flex;align-items:center;gap:9px}.save-status{font-size:12px;margin-right:10px;color:var(--muted)}.save-status.dirty{color:#9b6c19}.layout{display:grid;grid-template-columns:286px minmax(360px,1fr) 340px;height:calc(100vh - 82px)}aside.library{background:#fcfcf9;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.library-head{padding:23px 19px 15px}h2{font-size:14px;letter-spacing:1px;margin:0 0 12px}.count{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}input.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px}.filters{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.chip{padding:3px 9px;font-size:12px;background:transparent;border-radius:20px}.chip.active{background:var(--green);color:white;border-color:var(--green)}.card-list{overflow:auto;padding:0 10px 18px;flex:1}.card-item{display:flex;gap:11px;align-items:center;width:100%;padding:9px;border:1px solid transparent;text-align:left;background:transparent;margin-bottom:3px}.card-item.active{border-color:#9cbca8;background:#edf4ee}.card-item img{width:54px;height:42px;object-fit:cover;border-radius:5px;background:#e3e8e1}.card-item .title{font-size:13px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}.card-item .meta{color:var(--muted);font-size:11px}.dirty-dot{margin-left:auto;flex-shrink:0;width:6px;height:6px;background:var(--gold);border-radius:50%}.library-foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px}.editor{overflow:auto;padding:27px 30px 50px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--green);text-transform:uppercase}.card-heading{margin-bottom:25px;display:flex;justify-content:space-between;gap:15px;align-items:center}.card-heading h2{font-size:27px;line-height:1.3;margin:6px 0}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{display:inline-block;border-radius:5px;background:#e7ede6;color:#56725e;padding:1px 7px;font-size:11px}.section{border:1px solid var(--line);border-radius:12px;background:white;padding:20px;margin-bottom:16px}.section h3{font-size:14px;margin:0 0 13px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;color:#56665d;font-size:12px;margin-bottom:5px}.field input{width:100%;border:1px solid #dce3da;background:#fafbf8;border-radius:7px;padding:8px 10px;color:#22382a;font-size:17px;min-width:0}.field input.changed{background:#fffae8;border-color:#d8bd79}.field input:invalid{border-color:var(--bad);background:#fff1f0}.step{padding:16px 0;border-top:1px solid var(--line)}.step:first-of-type{border-top:0;padding-top:0}.step-title{font-weight:600;margin-bottom:10px;display:flex;gap:8px;align-items:center}.step-index{font-size:11px;color:#6c8172;border:1px solid #d7e1d8;width:22px;height:22px;text-align:center;border-radius:50%}.hint{font-size:12px;color:var(--muted);margin:6px 0 11px}.advanced{margin-top:12px}.advanced summary{font-size:12px;color:var(--muted);cursor:pointer}.advanced .columns{margin-top:10px}.preview{border-left:1px solid var(--line);overflow:auto;padding:26px 24px 40px;background:#ecefe8}.preview h2{margin-bottom:18px}.tabs{display:flex;background:#dfe6db;border-radius:8px;padding:3px;margin-bottom:17px}.tabs button{flex:1;background:transparent;border:0;font-size:12px;padding:6px}.tabs .active{background:white;box-shadow:0 1px 3px #00000010}.game-card{position:relative;background:#f6f2df;border:2px solid #72917b;border-radius:15px;padding:12px;box-shadow:0 9px 22px #17321e14;overflow:hidden}.game-card .card-cost{position:absolute;left:8px;top:7px;width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;border:2px solid #c7d6b1;font-size:18px;font-weight:700}.preview-title{text-align:center;font-weight:600;padding:2px 20px 10px;min-height:38px;font-size:14px;overflow-wrap:anywhere}.game-card img{width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid #b9c3a7;border-radius:6px;display:block}.type-line{text-align:center;color:#758061;font-size:11px;margin:8px 0}.description{white-space:pre-line;text-align:center;font-size:13px;line-height:1.8;min-height:100px;padding:2px 5px 12px}.keywords{text-align:center;color:#8e6535;font-size:12px}.preview-note{font-size:11px;color:#7f8b7c;margin:12px 0 24px}.changes{font-size:12px}.change-row{padding:9px 0;border-bottom:1px solid #d5dfd2}.change-row b{display:block;font-weight:500}.change-row span{color:#87651f}.empty{font-size:12px;color:var(--muted);padding:15px 0}.change-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 2px}.change-title h3{margin:0;font-size:13px}.bottom-note{font-size:11px;color:var(--muted);margin-top:15px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#203b2e;color:white;border-radius:10px;padding:12px 20px;box-shadow:0 4px 24px #0003;z-index:20;max-width:85vw;overflow-wrap:anywhere}.toast.error{background:#85352f}.hidden{display:none!important}.job-panel{position:fixed;right:22px;bottom:22px;width:min(600px,90vw);z-index:10;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 35px #0002;padding:17px}.job-head{display:flex;align-items:center;justify-content:space-between}.job-head strong{font-size:14px}.job-panel pre{font:11px/1.55 Consolas,monospace;background:#16251e;color:#d2e6d7;border-radius:7px;padding:13px;max-height:260px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.job-panel p{font-size:12px;color:var(--muted);margin:8px 0}.no-card{padding:55px 10px;color:var(--muted);text-align:center}@media(min-width:1600px){.layout{grid-template-columns:310px 1fr 390px}.editor{padding:34px 50px}}@media(max-width:1100px){.top{padding:0 18px}.layout{grid-template-columns:240px minmax(330px,1fr) 285px}.editor{padding:22px 18px}.preview{padding:22px 17px}.save-status{display:none}}@media(max-width:850px){.layout{grid-template-columns:220px 1fr;height:auto;min-height:calc(100vh - 82px)}aside.library{height:calc(100vh - 82px);position:sticky;top:0}.preview{grid-column:2;border-left:0}.editor{overflow:visible}.top{height:auto;min-height:82px;flex-wrap:wrap;padding:14px}.sub{display:none}}
</style></head><body>
<header class="top"><div class="brand"><div class="mark">鸠</div><div><h1>卡牌工坊</h1><div class="sub">PhigrosJiu · 调整数值，保留灵感</div></div></div><div class="actions"><span id="status" class="save-status">正在读取设计…</span><button id="reload" class="quiet">重新载入</button><button id="save" class="primary" disabled>保存修改</button><button id="build" disabled>构建并安装</button></div></header>
<div class="layout"><aside class="library"><div class="library-head"><h2>歌曲卡牌<span class="count" id="count">85 张</span></h2><input id="search" class="search" placeholder="搜索曲名或机制…" aria-label="搜索卡牌"><div id="rarities" class="filters"></div></div><div id="list" class="card-list"></div><div class="library-foot"><button id="export" class="small">导出修改</button><button id="import" class="small">导入修改</button><input type="file" id="import-file" accept="application/json,.json" class="hidden"></div></aside>
<main id="editor" class="editor"><div class="no-card">正在载入 85 张卡牌…</div></main>
<aside class="preview"><h2>效果预览</h2><div class="tabs"><button id="base-tab" class="active">基础</button><button id="up-tab">升级后</button></div><div class="game-card"><div id="preview-cost" class="card-cost">1</div><div id="preview-title" class="preview-title">鸠</div><img id="preview-art" alt="卡牌原曲绘"><div id="preview-type" class="type-line"></div><div id="preview-text" class="description"></div><div id="preview-keywords" class="keywords"></div></div><p class="preview-note">曲绘与效果文本预览；游戏中的卡框样式以实际显示为准。</p><div class="change-title"><h3>待保存修改</h3><button id="reset-card" class="small quiet">还原当前卡</button></div><div id="changes" class="changes"></div><p class="bottom-note">保存自动备份到本地。保存后，点击“构建并安装”应用到游戏；安装前请退出游戏。</p></aside></div>
<div id="toast" class="toast hidden" role="status"></div><section id="job" class="job-panel hidden"><div class="job-head"><strong id="job-title">正在构建</strong><button id="hide-job" class="small quiet">收起</button></div><p id="job-note">编译、检查资源与双向同载，然后安装主版。</p><pre id="job-log"></pre></section>
<script>
'use strict';
const token='__SESSION_TOKEN__', $=id=>document.getElementById(id), types={Attack:'攻击',Skill:'技能',Power:'能力'},rarities={All:'全部',Basic:'基础',Common:'普通',Uncommon:'罕见',Rare:'稀有',Ancient:'先古'};
let archivedDraft=null;let state,selected,rarity='All',upgraded=false,dirty=new Map(),previewCard,seq=0,timer,toastTimer,busy=false,jobTimer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers:{'X-Jiu-Token':token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await response.json();if(!response.ok)throw Error(data.error||'操作失败');return data;}
function toast(message,error=false){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').className='toast'+(error?' error':'');toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),error?9000:5000);}
function original(){return state.cards.find(c=>c.className===selected)}
function valueAt(c,field){if(field.startsWith('keywords.')||field.startsWith('upgradeKeywords.')){const [group,key]=field.split('.');return (c[group]||[]).includes(key);}let x=c;for(const key of field.split('.')){if(x===undefined)break;x=x[key]}if(x===undefined&&field.endsWith('.ux'))x=valueAt(c,field.slice(0,-2)+'x');return x??0;}
function current(){const c=structuredClone(original());for(const p of dirty.values()){if(p.card!==selected)continue;if(p.field.startsWith('keywords.')||p.field.startsWith('upgradeKeywords.')){const [group,key]=p.field.split('.');c[group]=(c[group]||[]).filter(k=>k!==key);if(p.value)c[group].push(key);continue;}let x=c;const keys=p.field.split('.');for(const key of keys.slice(0,-1))x=x[key];x[keys.at(-1)]=structuredClone(p.value);}return c;}
function cleanSteps(steps){return steps.map(s=>Object.fromEntries(Object.entries(s).filter(([k])=>k!=='label')))}
function setChange(field,value){const key=selected+':'+field;let before=valueAt(original(),field);if(field==='steps')before=cleanSteps(before);if(JSON.stringify(value)===JSON.stringify(before))dirty.delete(key);else dirty.set(key,{card:selected,field,value});stash();updateStatus();renderChanges();clearTimeout(timer);timer=setTimeout(refreshPreview,180);}
function setSteps(steps){for(const [key,p]of dirty)if(p.card===selected&&p.field.startsWith('steps.'))dirty.delete(key);setChange('steps',cleanSteps(steps));}
function patches(){return {revision:state.revision,patches:[...dirty.values()]};}
function stash(){try{if(dirty.size)localStorage.setItem('jiu-card-draft',JSON.stringify(patches()));else localStorage.removeItem('jiu-card-draft')}catch{}}
function updateStatus(){const cards=new Set([...dirty.values()].map(p=>p.card));$('status').textContent=dirty.size?`${cards.size} 张牌 · ${dirty.size} 项未保存`:'所有修改已保存';$('status').classList.toggle('dirty',!!dirty.size);const invalid=!!document.querySelector('input:invalid');$('save').disabled=!dirty.size||busy||invalid;$('build').disabled=!!dirty.size||busy||invalid;$('build').title=dirty.size?'请先保存修改':'';$('reload').disabled=busy;$('reload').textContent=dirty.size?'导出并载入':'重新载入';}
function renderList(){const q=$('search').value.toLowerCase().trim();const cards=state.cards.filter(c=>(rarity==='All'||c.rarity===rarity)&&[c.name,c.themes.join(' '),c.descriptions.join(' ')].join(' ').toLowerCase().includes(q));$('count').textContent=`${cards.length} / 85 张`;$('list').innerHTML=cards.length?cards.map(c=>`<button class="card-item ${c.className===selected?'active':''}" data-card="${c.className}"><img loading="lazy" src="/art/${c.className}" alt=""><div><div class="title">${esc(c.name)}</div><div class="meta">${c.rarityLabel} · ${types[c.type]} · ${c.costsX?"X":c.cost} 费</div></div>${[...dirty.values()].some(p=>p.card===c.className)?'<span class="dirty-dot" title="有未保存修改"></span>':''}</button>`).join(''):'<div class="empty">没有找到匹配的卡牌</div>';for(const button of $('list').querySelectorAll('[data-card]'))button.onclick=()=>choose(button.dataset.card);}
function field(label,key,min=0,max=9999){const c=current(),changed=dirty.has(selected+':'+key)||(key.startsWith('steps.')&&dirty.has(selected+':steps')&&valueAt(c,key)!==valueAt(original(),key));return `<div class="field"><label for="f-${key}">${label}</label><input id="f-${key}" type="number" min="${min}" max="${max}" step="1" required value="${valueAt(c,key)}" data-field="${key}" class="${changed?'changed':''}"></div>`;}
function renderEditor(){const c=current(),kinds=state.effectKinds||{},keywordOptions=state.keywordOptions||[];const conditions={replay:'重放时生效',plays:'此前出牌数量达到门槛时生效',lastAttack:'上一张是攻击牌时生效',lastSkill:'上一张是技能牌时生效',debt:'有待偿透支时生效',signal:'达到信号门槛时生效'};
$('editor').innerHTML=`<div class="card-heading"><div><div class="eyebrow">${c.rarityLabel} / ${types[c.type]}</div><h2>${esc(c.name)}</h2><div class="tags">${c.themes.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div><span class="tag">${state.cards.indexOf(original())+1} / 85</span></div>
<section class="section"><h3>能量费用</h3>${c.costsX?'<p class="hint">X 费：打出时消耗全部当前能量，基础与升级后相同。</p>':`<div class="columns">${field('基础费用','cost',0,99)}${field('升级后费用','upgradeCost',0,99)}</div>`}</section>
<section class="section"><h3>卡牌关键词</h3><div class="columns">${keywordOptions.map(k=>`<label title="${esc(k.description)}" style="display:flex;align-items:center;gap:9px;padding:7px 0;cursor:pointer"><input type="checkbox" data-keyword="${k.key}" ${c.keywords.includes(k.key)?'checked':''}>${esc(k.label)}</label>`).join('')}</div><p class="hint">勾选添加，取消勾选移除。直接使用游戏原生效果。</p><details class="advanced"><summary>仅升级后增加的关键词</summary><div class="columns">${keywordOptions.map(k=>`<label style="display:flex;align-items:center;gap:9px;padding:7px 0"><input type="checkbox" data-upgrade-keyword="${k.key}" ${(c.upgradeKeywords||[]).includes(k.key)?'checked':''}>${esc(k.label)}</label>`).join('')}</div></details></section>
<section class="section"><h3>效果词条</h3>${c.steps.map((s,i)=>`<div class="step"><div class="step-title"><span class="step-index">${i+1}</span>${esc(s.label||kinds[s.kind]||s.kind)}<button class="small quiet" data-remove="${i}" style="margin-left:auto;color:var(--bad)">移除</button></div>${s.condition?`<p class="hint">${conditions[s.condition]||esc(s.condition)}</p>`:''}<div class="columns">${field('基础值',`steps.${i}.value`)}${field('升级后',`steps.${i}.upgrade`)}</div><details class="advanced"><summary>信号消耗与加成参数</summary><div class="columns">${['AttackBonus','BlockBonus','SignalAttack','SignalBlock'].includes(s.kind)?field('每点加成 · 基础',`steps.${i}.x`)+field('每点加成 · 升级',`steps.${i}.ux`):''}${field('消耗信号（0 为无）',`steps.${i}.pay`)}${['SignalAttack','SignalBlock','SignalRare'].includes(s.kind)?field('最多使用信号',`steps.${i}.cap`):''}${['signal','plays'].includes(s.condition)?field('触发门槛',`steps.${i}.threshold`):''}</div></details></div>`).join('')||'<div class="empty">暂无效果，可在下方添加。</div>'}
<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><select id="effect-kind" aria-label="要添加的效果" style="flex:1;padding:9px;border:1px solid var(--line);border-radius:7px;min-width:130px">${Object.entries(kinds).map(([key,label])=>`<option value="${key}" ${key==='Draw'?'selected':''}>${esc(label)}</option>`).join('')}</select><button id="add-effect">添加效果</button></div><select id="effect-power" aria-label="要添加的能力" class="hidden" style="margin-top:9px;width:100%;padding:8px">${Object.entries(state.powerOptions||{}).map(([key,label])=>`<option value="${key}">${esc(label)}</option>`).join('')}</select></section>
<section class="section"><h3>重放</h3><div class="columns">${field('固定重放次数','replays',0,99)}${field('重放所需信号（0 关闭）','signalReplayCost',0,99)}</div><details class="advanced"><summary>按出牌数量触发</summary><div class="columns">${field('此前出牌门槛（0 关闭）','playedReplayThreshold',0,99)}</div></details></section><p class="hint">保存后，基础与升级均为0的效果会被删除；仅一边为0时，只隐藏该版本的词条。0费保留。</p>`;
for(const input of $('editor').querySelectorAll('[data-field]'))input.oninput=()=>{if(!input.validity.valid){updateStatus();return;}const field=input.dataset.field,value=Number(input.value);if(field.startsWith('steps.')){const c=current(),parts=field.split('.');c.steps[Number(parts[1])][parts[2]]=value;setSteps(c.steps);}else setChange(field,value);input.classList.toggle('changed',value!==valueAt(original(),field));};
for(const box of $('editor').querySelectorAll('[data-keyword]'))box.onchange=()=>setChange('keywords.'+box.dataset.keyword,box.checked);
for(const box of $('editor').querySelectorAll('[data-upgrade-keyword]'))box.onchange=()=>setChange('upgradeKeywords.'+box.dataset.upgradeKeyword,box.checked);
for(const button of $('editor').querySelectorAll('[data-remove]'))button.onclick=()=>{const c=current();c.steps.splice(Number(button.dataset.remove),1);setSteps(c.steps);renderEditor();};
$('effect-kind').onchange=()=>$('effect-power').classList.toggle('hidden',$('effect-kind').value!=='Power');
$('add-effect').onclick=()=>{const c=current(),kind=$('effect-kind').value,s={kind,value:1,upgrade:1};if(['AttackBonus','BlockBonus'].includes(kind))Object.assign(s,{x:1,ux:1,condition:'debt'});if(['SignalAttack','SignalBlock'].includes(kind))Object.assign(s,{x:1,ux:1,cap:3});if(kind==='SignalRare')Object.assign(s,{value:4,upgrade:3,cap:12});if(kind==='Power')s.power=$('effect-power').value;c.steps.push(s);setSteps(c.steps);renderEditor();};
}
function labelFor(c,field){if(field==='steps')return '效果词条';if(field.startsWith('keywords.')||field.startsWith('upgradeKeywords.'))return (field.startsWith('upgradeKeywords.')?'升级新增 · ':'')+((state.keywordOptions||[]).find(k=>k.key===field.split('.')[1])?.label||field.split('.')[1]);const names={cost:'基础费用',upgradeCost:'升级费用',replays:'重放次数',signalReplayCost:'重放信号',playedReplayThreshold:'出牌门槛',value:'基础值',upgrade:'升级值',x:'基础加成',ux:'升级加成',pay:'信号消耗',cap:'信号上限',threshold:'触发门槛'};if(!field.startsWith('steps.'))return names[field];const parts=field.split('.');return c.steps[Number(parts[1])].label+' · '+names[parts[2]];}
function displayChange(value){if(Array.isArray(value))return value.map(s=>(state.effectKinds[s.kind]||s.kind)+' '+s.value+'/'+s.upgrade).join('；')||'无';return typeof value==='boolean'?(value?'有':'无'):value;}
function renderChanges(){$('changes').innerHTML=dirty.size?[...dirty.values()].map(p=>{const c=state.cards.find(c=>c.className===p.card);return `<div class="change-row"><b>${esc(c.name)} · ${esc(labelFor(c,p.field))}</b><span>${esc(displayChange(valueAt(c,p.field)))} → ${esc(displayChange(p.value))}</span></div>`}).join(''):'<div class="empty">还没有未保存的修改</div>';$('reset-card').disabled=![...dirty.values()].some(p=>p.card===selected)||busy;}
function renderPreview(){if(!previewCard)return;const c=previewCard;$('preview-cost').textContent=c.costsX?'X':(upgraded?c.upgradeCost:c.cost);$('preview-title').textContent=c.name+(upgraded?' +':'');$('preview-art').src='/art/'+c.className;$('preview-art').alt=c.name+' 原曲绘';$('preview-type').textContent=c.rarityLabel+' · '+types[c.type];$('preview-text').textContent=c.descriptions[upgraded?1:0];$('preview-keywords').textContent=[...new Set([...c.keywords,...(upgraded?(c.upgradeKeywords||[]):[])])].map(k=>(state.keywordOptions||[]).find(option=>option.key===k)?.label||k).join(' · ');$('base-tab').classList.toggle('active',!upgraded);$('up-tab').classList.toggle('active',upgraded);}
async function refreshPreview(){const request=++seq,card=selected;try{const result=dirty.size?await api('/api/preview',patches()):state;if(request!==seq||card!==selected)return;previewCard=result.cards.find(c=>c.className===selected);renderPreview();}catch(e){toast(e.message,true);}}
function choose(id){selected=id;seq++;renderList();renderEditor();renderChanges();updateStatus();refreshPreview();$('editor').scrollTop=0;}
async function load(){const next=await api('/api/state');state=next;if(!selected||!state.cards.some(c=>c.className===selected))selected=state.cards[0].className;choose(selected);if(state.job)showJob(state.job);}
$('search').oninput=renderList;for(const [key,name]of Object.entries(rarities)){const button=document.createElement('button');button.className='chip'+(key==='All'?' active':'');button.textContent=name;button.onclick=()=>{rarity=key;for(const b of $('rarities').children)b.classList.remove('active');button.classList.add('active');renderList();};$('rarities').append(button);}
$('base-tab').onclick=()=>{upgraded=false;renderPreview()};$('up-tab').onclick=()=>{upgraded=true;renderPreview()};
$('save').onclick=async()=>{busy=true;updateStatus();try{const result=await api('/api/save',patches());state=result;dirty.clear();stash();choose(selected);toast(result.backup?'已保存，旧设计已自动备份。':'设计已是最新。');}catch(e){toast(e.message,true)}finally{busy=false;updateStatus()}};
$('reload').onclick=async()=>{try{if(dirty.size){exportChanges();dirty.clear();stash();}await load();toast('已载入最新设计，未保存的修改已导出。')}catch(e){toast(e.message,true)}};
$('reset-card').onclick=()=>{for(const [key,p]of dirty)if(p.card===selected)dirty.delete(key);stash();choose(selected)};
function exportChanges(){const file=new Blob([JSON.stringify({...((dirty.size?null:archivedDraft)||patches()),exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download='鸠-卡牌修改.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};$('export').onclick=exportChanges;
$('import').onclick=()=>$('import-file').click();$('import-file').onchange=async()=>{const file=$('import-file').files[0];if(!file)return;try{const data=JSON.parse(await file.text());await api('/api/preview',data);for(const p of data.patches)dirty.set(p.card+':'+p.field,p);stash();choose(selected);toast('修改已导入，保存后生效。')}catch(e){toast(e.message,true)}$('import-file').value=''};
function showJob(job){if(!job)return;$('job').classList.remove('hidden');busy=job.status==='running';$('job-title').textContent={running:'正在构建并安装…',success:'构建并安装完成',failed:'构建或安装未完成'}[job.status];$('job-note').textContent=job.status==='success'?'可以启动游戏查看新数值。':job.status==='failed'?'设计已保存。请查看日志；若 DLL 被占用，请退出游戏后重试。':'正在编译、检查资源和双向同载，然后安装主版。';$('job-log').textContent=job.output||'正在启动构建…';$('job-log').scrollTop=$('job-log').scrollHeight;updateStatus();clearTimeout(jobTimer);if(busy)jobTimer=setTimeout(pollJob,1500);}
async function pollJob(){try{showJob((await api('/api/job')).job)}catch(e){toast(e.message,true);busy=false;updateStatus()}}
$('build').onclick=async()=>{busy=true;updateStatus();try{showJob((await api('/api/build',{revision:state.revision})).job)}catch(e){busy=false;updateStatus();toast(e.message,true)}};$('hide-job').onclick=()=>$('job').classList.add('hidden');
window.onbeforeunload=event=>{if(dirty.size){event.preventDefault();event.returnValue=''}};
(async()=>{try{await load();const draft=localStorage.getItem('jiu-card-draft');if(draft){const data=JSON.parse(draft);if(data.revision===state.revision||state.compatibleRevisions?.includes(data.revision)){data.revision=state.revision;await api('/api/preview',data);dirty=new Map(data.patches.map(p=>[p.card+':'+p.field,p]));choose(selected);toast('已恢复上次未保存的修改。')}else {archivedDraft=data;toast('有一份旧设计草稿，未覆盖当前文件。可用“导出修改”保留。',true);}}}catch(e){toast('无法载入：'+e.message,true)}})();
</script></body></html>
